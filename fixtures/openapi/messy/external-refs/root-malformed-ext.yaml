openapi: "3.1.0"
info:
  title: Malformed External Ref
  version: "1.0.0"
  description: >
    External $ref points to a file that contains invalid YAML.
    bundle() should throw ParserError (code: EPARSER) → parse_error.
paths:
  /pets:
    get:
      operationId: listPets
      summary: List pets
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./malformed-ext.yaml#/components/schemas/Pet"
